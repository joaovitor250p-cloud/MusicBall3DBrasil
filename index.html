function card(r,index,list){return `<article class="route"><div class="routeTop"><strong class="routeCode">${escapeHTML(r.code)}</strong><span class="city">${escapeHTML(r.city)}</span></div>${list==='routes'?'<div class="holdZone" data-hold-zone="true"><div class="inner">':'<div class="inner" style="margin-top:17px">'}${water()}<div class="detail"><span class="ico">${ico('hub')}</span><div><div class="label">HUB</div><div class="value">${escapeHTML(r.hub)}</div></div></div><div class="detail"><span class="ico">${ico('clock')}</span><div><div class="label">Horário</div><div class="value">Carregamento às ${escapeHTML(normalizeTime(r.load))}</div></div></div><div class="detail"><span class="ico">${ico('wave')}</span><div><div class="label">Onda</div><div class="value">${escapeHTML(r.wave)}</div></div></div><div class="detail"><span class="ico">${ico('pin')}</span><div><div class="label">Endereço</div><div class="value"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.address)}" target="_blank" rel="noopener">${escapeHTML(r.address)} ↗</a></div></div></div></div>${list==='routes'?'<div class="holdOverlay" role="button" tabindex="0" aria-label="Segure para ver os detalhes da rota"><span class="holdButton"><span class="finger"><svg class="fingerIcon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="#ec5136" d="M9.2 10.6V4.9a2 2 0 0 1 4 0v6.3c.4-.6 1.2-.9 1.9-.6.6.2 1 .7 1.2 1.3.5-.5 1.2-.7 1.9-.4.7.3 1 1 1.1 1.6.5-.3 1.1-.4 1.7-.1.7.3 1.1 1 1.1 1.8v2.1c0 3.8-2.4 6.1-6.1 6.1h-2.9c-2.2 0-3.3-.9-4.5-2.4l-3.8-4.8c-.7-.9-.6-2 .2-2.7.8-.7 1.9-.6 2.6.1l1.6 1.8v-4.4Z"/><path fill="none" stroke="#ec5136" stroke-width="1.7" stroke-linecap="round" d="M5.4 5.6 3.9 4.2M6.5 2.9V1.4M4.5 9.1H2.7"/></svg></span>Segure para ver</span></div></div>':''}<div class="foot"><span class="stamp">${escapeHTML(dateOnly(r.chosen))}${footerTime(r)?` ${escapeHTML(footerTime(r))}`:``}</span><button class="${list==='routes'?'remove':'primary'}" style="width:auto;margin-top:0" data-action="${list==='routes'?'remove':'choose'}" data-index="${index}">${list==='routes'?'Remover':'Escolher'}</button></div></article>`}
function heading(icon,label){return `<div class="heading"><span class="symbol">${icon}</span>${label}</div>`}
function render(){const title={home:'Início',offers:'Ofertas',routes:'Minhas Rotas'}[tab];$('pageTitle').textContent=title;$('pageSubtitle').textContent=tab==='home'?'Nuvem Entregas Rápidas':'Clusters e Xepas';$('name').textContent=data.profile.name||'';$('driverId').textContent=data.profile.id||'';$('settings').hidden=tab!=='home';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let countBadge=$('routeCount');if(countBadge){countBadge.textContent=data.routes.length;countBadge.hidden=!data.routes.length}let html='';if(tab==='home'){const clusters=data.routes.filter(r=>r.kind==='cluster').length,xepas=data.routes.filter(r=>r.kind==='xepa').length;html=heading(ico('chart'),'Sua semana')+`<div class="stats"><div class="stat"><span class="num">${clusters}</span><span class="desc">Clusters<br>escolhidas</span></div><div class="stat"><span class="num">${xepas}</span><span class="desc">Xepas<br>escolhidas</span></div></div>`+heading(ico('bolt'),'Atalhos')+`<button class="shortcut" data-action="offers"><span class="sym">${ico('map')}</span>Ver clusters</button><button class="shortcut" data-action="offers"><span class="sym">${ico('box')}</span>Ver xepas</button>`+heading(ico('bell'),'Avisos')+`<div class="notice">${escapeHTML(data.profile.notice)}</div>`}else if(tab==='offers'){html='';}else{const clusters=data.routes.map((r,i)=>({r,i})).filter(x=>x.r.kind!=='xepa'),xepas=data.routes.map((r,i)=>({r,i})).filter(x=>x.r.kind==='xepa');html=heading(ico('pin'),'Minhas Clusters')+(clusters.map(x=>card(x.r,x.i,'routes')).join('')||'<div class="empty">Nenhum cluster escolhido</div>')+(xepas.length?heading(ico('box'),'Minhas Xepas')+xepas.map(x=>card(x.r,x.i,'routes')).join(''):'')}$('main').innerHTML=html;tick()}
function tick(){const t=clock(),s=`${data.profile.id} · ${t}`;document.querySelectorAll('.watertext').forEach(e=>e.textContent=s);const live=$('liveTime');if(live)live.textContent=t}
const pFields=[['name','Nome do motorista'],['id','Driver ID']];
// As próximas opções de HUB podem ser acrescentadas aqui, mantendo o endereço associado.
const HUBS=[{id:'mooca',name:'OF Mooca',address:'Rua Cadiriri, 666 - Pq da Mooca',city:'São Paulo - SP'}];
// The footer is the date the route was first saved; the loading time is chosen by the user.
const currentStamp=()=>new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
function dateOnly(v){const text=String(v||'');const match=text.match(/\b\d{2}\/\d{2}\/\d{4}\b/);return match?match[0]:''}
function footerTime(r){const supplied=normalizeTime(r.footerTime||'');if(/^([01]\d|2[0-3]):[0-5]\d$/.test(supplied))return supplied;const match=String(r.chosen||'').match(/(?:^|\s)([01]?\d|2[0-3]):([0-5]\d)(?::[0-5]\d)?\s*$/);return match?match[1].padStart(2,'0')+':'+match[2]:''}
function normalizeTime(v){let text=String(v||'').trim();if(/^\d{3,4}$/.test(text)){text=text.padStart(4,'0');text=text.slice(0,2)+':'+text.slice(2)}const m=text.match(/^(\d{1,2}):(\d{2})$/);if(!m)return text;const hh=Number(m[1]),mm=Number(m[2]);return hh<24&&mm<60?String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'):text}

const rFields=[['kind','Tipo'],['code','Código da rota'],['hub','HUB'],['load','Horário de carregamento'],['wave','Onda']];
function hubForRoute(r){return HUBS.find(h=>h.id===r.hubId)||HUBS.find(h=>h.name.toLowerCase()===String(r.hub||'').toLowerCase())}
function option(value,title,selected){return `<option value="${escapeHTML(value)}" ${selected?'selected':''}>${escapeHTML(title)}</option>`}
function routeField(k,label,obj){let input='';if(k==='kind')input=`<select id="field-kind" name="kind" required>${option('cluster','Cluster',obj.kind==='cluster')}${option('xepa','Xepa',obj.kind==='xepa')}</select>`;
else if(k==='hub'){const current=hubForRoute(obj);input=`<select id="field-hub" name="hubId" required><option value="" disabled ${!current?'selected':''}>Selecione o HUB</option>${HUBS.map(h=>option(h.id,h.name,current?.id===h.id)).join('')}</select>`}
else if(k==='wave')input=`<select id="field-wave" name="wave" required><option value="" disabled ${!obj.wave?'selected':''}>Selecione a onda</option>${[1,2,3].map(n=>option(String(n),'Onda '+n,String(obj.wave)===String(n))).join('')}</select>`;
else if(k==='load')input=`<input type="time" id="field-load" name="load" value="${escapeHTML(normalizeTime(obj.load))}" step="60" required><small class="timeHelp">Escolha a hora e os minutos (ex.: 14:30).</small>`;
else input=`<input id="field-${k}" name="${k}" maxlength="180" value="${escapeHTML(obj[k]||'')}" required>`;
return `<div class="field ${k==='code'?'wide':''}"><label for="field-${k}">${label}</label>${input}</div>`}
function editOpen(mode,list='routes',index=0){
 $('form').querySelector('button[type=submit]').hidden=false;edit={mode,list,index};
 let obj=mode==='profile'?data.profile:mode==='add'?{kind:'cluster',code:'',hubId:'',load:'',wave:'',footerTime:''}:data[list][index];
 $('modalTitle').textContent=mode==='profile'?'Editar perfil':mode==='add'?'Adicionar rota':'Editar rota';
 $('modalHint').textContent=mode==='profile'?'Preencha seu nome e Driver ID.':'O horário de carregamento e o horário do rodapé são independentes. A data do rodapé é automática, mas você escolhe o horário que aparece ao lado dela.';
 $('fields').innerHTML=mode==='profile'?pFields.map(([k,label])=>`<div class="field wide"><label for="field-${k}">${label}</label><input id="field-${k}" name="${k}" maxlength="180" value="${escapeHTML(obj[k]||'')}" required></div>`).join(''):rFields.map(([k,label])=>routeField(k,label,obj)).join('')+`<div class="field wide"><label>Endereço do HUB (automático)</label><div id="hubAddress" class="autoAddress" aria-live="polite">Selecione um HUB acima</div></div><div class="field wide"><label>Data e horário do rodapé (abaixo do cartão)</label><div class="footerFields"><div class="autoAddress" aria-label="Data automática">${escapeHTML(dateOnly(obj.chosen)||currentStamp())}</div><input type="time" name="footerTime" id="field-footerTime" aria-label="Horário do rodapé" value="${escapeHTML(footerTime(obj))}" step="60" required></div><small class="timeHelp">A data é automática. Escolha o horário que aparecerá ao lado dela, ex.: 00:04.</small></div>`;
 $('modal').classList.add('open');updateHubAddress();
}
function updateHubAddress(){const el=$('hubAddress');if(!el)return;const selected=HUBS.find(h=>h.id===$('field-hub')?.value);el.textContent=selected?selected.address:'Selecione um HUB acima'}
$('fields').addEventListener('change',e=>{if(e.target.id==='field-hub')updateHubAddress()});
$('form').addEventListener('submit',e=>{
 e.preventDefault();const obj=Object.fromEntries(new FormData(e.currentTarget).entries());if(edit.mode!=='profile'){obj.load=normalizeTime(obj.load);if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(obj.load)){alert('Escolha um horário de carregamento válido, por exemplo 14:30.');return}obj.footerTime=normalizeTime(obj.footerTime);if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(obj.footerTime)){alert('Escolha o horário do rodapé, ao lado da data, por exemplo 00:04.');return}}
 if(edit.mode==='profile')data.profile={...data.profile,...obj};
 else{
  const hub=HUBS.find(h=>h.id===obj.hubId);if(!hub){alert('Escolha um HUB válido.');return}
  obj.hub=hub.name;obj.address=hub.address;obj.city=hub.city;
  if(edit.mode==='add')data[edit.list].push({...obj,chosen:currentStamp(),key:globalThis.crypto?.randomUUID?.()||String(Date.now())});
  else {const original=data[edit.list][edit.index];data[edit.list][edit.index]={...original,...obj,chosen:dateOnly(original.chosen)||currentStamp()}}
 }
 persist();$('modal').classList.remove('open');render();
});
function settingsMenu(){
 $('modalTitle').textContent='⚙ Configurações';
 $('modalHint').textContent='Escolha o que deseja modificar.';
 $('fields').innerHTML=`<div class="field wide"><button class="settingsChoice" type="button" data-setting="profile">Editar perfil — nome e Driver ID</button></div><div class="field wide"><button class="settingsChoice" type="button" data-setting="routes">Gerenciar Minhas Rotas</button></div>`;
 $('form').querySelector('button[type=submit]').hidden=true;$('modal').classList.add('open');
}
function settingsList(list){
 $('modalTitle').textContent='Gerenciar Minhas Rotas';
 $('modalHint').textContent='Escolha a rota para editar. Ao tocar em uma rota, você pode mudar código, HUB, horário de carregamento e onda. O endereço acompanha o HUB. A data de baixo é automática e o horário ao lado dela pode ser escolhido.';
 $('fields').innerHTML=data[list].map((r,i)=>`<div class="field wide"><button class="settingsChoice" type="button" data-setting="edit" data-list="${list}" data-index="${i}"><div style="font-weight:700">✎ ${escapeHTML(r.code)} — ${escapeHTML(r.hub)}</div><div style="font-size:12px;opacity:.8;margin-top:4px">Carregamento: ${escapeHTML(normalizeTime(r.load)||'Não definido')} • Rodapé: ${escapeHTML(footerTime(r)||'A definir')} • Onda: ${escapeHTML(String(r.wave||'-'))}</div></button></div>`).join('')+`<div class="field wide"><button class="settingsChoice" type="button" data-setting="add" data-list="${list}">＋ Adicionar rota</button></div><div class="field wide"><button class="settingsChoice secondary" type="button" data-setting="back">Voltar</button></div>`;
 $('form').querySelector('button[type=submit]').hidden=true;
 $('modal').classList.add('open');
}
$('fields').addEventListener('click',e=>{const b=e.target.closest('button[data-setting]');if(!b)return;const a=b.dataset.setting;if(a==='profile'){editOpen('profile');$('form').querySelector('button[type=submit]').hidden=false}else if(a==='routes')settingsList('routes');else if(a==='edit'||a==='add'){editOpen(a==='edit'?'route':'add',b.dataset.list,Number(b.dataset.index||0));$('form').querySelector('button[type=submit]').hidden=false}else if(a==='back')settingsMenu()});
// O cartão retorna ao modo desfocado ao soltar, cancelar o toque ou sair da tela.
let heldOverlay=null;
function stopHold(){if(heldOverlay){heldOverlay.closest('.holdZone')?.classList.remove('revealed');heldOverlay=null}}
$('main').addEventListener('pointerdown',e=>{const overlay=e.target.closest('.holdOverlay');if(!overlay)return;e.preventDefault();stopHold();heldOverlay=overlay;overlay.closest('.holdZone')?.classList.add('revealed');try{overlay.setPointerCapture(e.pointerId)}catch{}});
for(const eventName of ['pointerup','pointercancel','lostpointercapture']) document.addEventListener(eventName,stopHold,true);
$('main').addEventListener('keydown',e=>{const overlay=e.target.closest('.holdOverlay');if(!overlay||!(e.key===' '||e.key==='Enter'))return;e.preventDefault();stopHold();heldOverlay=overlay;overlay.closest('.holdZone')?.classList.add('revealed')});
$('main').addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')stopHold()});
window.addEventListener('blur',stopHold);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopHold()});
$('main').addEventListener('contextmenu',e=>{if(e.target.closest('.holdZone'))e.preventDefault()});
$('settings').onclick=settingsMenu;$('cancel').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('exitBtn').onclick=()=>alert('Nenhuma sessão de usuário está conectada.');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('main').addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b)return;const act=b.dataset.action,i=Number(b.dataset.index),list=b.dataset.list;if(act==='offers'){tab='offers';render()}else if(act==='filter'){offFilter=b.dataset.kind;render()}else if(act==='choose'){const r=data.offers.splice(i,1)[0];r.chosen=clock().slice(0,16);data.routes.push(r);persist();tab='routes';render()}else if(act==='remove'){if(confirm(`Remover a rota ${data.routes[i].code}?`)){data.routes.splice(i,1);persist();render()}}});render();setInterval(tick,1000);

let deferredInstallEvent=null;
const installButton=document.getElementById('installApp');
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
const installedFlag='nuvem-entregas-rapidas-installed-v1';
function updateInstallVisibility(){
  let previouslyInstalled=false;
  try{previouslyInstalled=localStorage.getItem(installedFlag)==='1'}catch{}
  if(installButton)installButton.hidden=isStandalone()||previouslyInstalled;
}
window.addEventListener('beforeinstallprompt',(event)=>{
  event.preventDefault();
  deferredInstallEvent=event;
  // If the browser makes installation available again, allow the button to reappear.
  try{localStorage.removeItem(installedFlag)}catch{}
  updateInstallVisibility();
});
window.addEventListener('appinstalled',()=>{
  deferredInstallEvent=null;
  try{localStorage.setItem(installedFlag,'1')}catch{}
  updateInstallVisibility();
});
window.matchMedia('(display-mode: standalone)').addEventListener?.('change',updateInstallVisibility);
window.addEventListener('pageshow',updateInstallVisibility);
updateInstallVisibility();
if(installButton) installButton.addEventListener('click',async()=>{
 if(isStandalone()){updateInstallVisibility();return}
 if(deferredInstallEvent){const event=deferredInstallEvent;deferredInstallEvent=null;try{await event.prompt()}catch{}return}
 if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true){alert('Nuvem Entregas Rápidas já está aberto como aplicativo.');return}
 alert('Para salvar Nuvem Entregas Rápidas no celular: abra este site publicado no Chrome, toque nos três pontinhos (⋮) e selecione "Instalar app" ou "Adicionar à tela inicial". Em arquivos locais, a instalação não fica disponível.');
});
if('serviceWorker' in navigator && location.protocol==='https:') window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
